<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NERO 采集数据</title>
<style>
:root{color-scheme:light;
  --bg:#f4f4f2;--surface:#fcfcfb;--sunk:#efeeeb;--line:#e2e1dc;--ink:#151513;--ink2:#52514e;--ink3:#86857f;
  --acc:#2a78d6;--good:#0b8a0b;--bad:#d03b3b;--warn:#b77400;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
  --ph-reset:#eb6834;--ph-pos:#2a78d6;--ph-task:#1baf7a;--ph-none:#b9b8b2;--hold:rgba(27,175,122,.16);
  --shadow:0 1px 2px rgba(20,20,15,.05),0 4px 16px rgba(20,20,15,.05)}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;
  --bg:#121211;--surface:#1a1a19;--sunk:#222220;--line:#30302d;--ink:#f0efec;--ink2:#c3c2b7;--ink3:#8d8c85;
  --acc:#3987e5;--good:#33b833;--bad:#e66767;--warn:#e0a33a;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#2f9e2f;--s7:#9085e9;--s8:#e66767;
  --ph-reset:#d95926;--ph-pos:#3987e5;--ph-task:#199e70;--ph-none:#55544f;--hold:rgba(25,158,112,.22);--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#121211;--surface:#1a1a19;--sunk:#222220;--line:#30302d;--ink:#f0efec;--ink2:#c3c2b7;--ink3:#8d8c85;
  --acc:#3987e5;--good:#33b833;--bad:#e66767;--warn:#e0a33a;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#2f9e2f;--s7:#9085e9;--s8:#e66767;
  --ph-reset:#d95926;--ph-pos:#3987e5;--ph-task:#199e70;--ph-none:#55544f;--hold:rgba(25,158,112,.22);--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.6 -apple-system,"Segoe UI","Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
a{color:var(--acc);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand svg{width:20px;height:20px}
.dss{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.ds{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.ds[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ds small{color:var(--ink3);margin-left:4px} .ds[aria-current="true"] small{color:inherit;opacity:.7}
.live{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink3)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.live.off i{background:var(--ink3);box-shadow:none}
.theme{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:30px;height:30px;cursor:pointer}
main{max-width:1180px;margin:0 auto;padding:22px 16px 80px;display:flex;flex-direction:column;gap:18px}
.hero{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end}
.hero h1{margin:0;font-size:28px;line-height:1.2;letter-spacing:-.01em}
.hero .task{color:var(--ink2);margin-top:4px;max-width:70ch}
.hero .path{color:var(--ink3);font-size:12.5px;word-break:break-all}
.dl{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 11px;font-size:13px;color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--ink3);text-decoration:none}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.kpi b{display:block;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums;font-weight:650}
.kpi span{color:var(--ink3);font-size:12.5px}
.kpi .split{display:flex;gap:12px;align-items:baseline}
.kpi .split em{font-style:normal;font-size:13px;color:var(--ink2);white-space:nowrap}
.kpi .split{flex-wrap:wrap;column-gap:8px}
@media (max-width:640px){.top .in{gap:8px}.dss{order:3;flex-basis:100%;overflow-x:auto;flex-wrap:nowrap}.live span{font-size:11.5px}main .eps{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}main .ep .bd{padding:7px 8px 9px}.hero h1{font-size:23px}}
.ok-i{color:var(--good)} .bad-i{color:var(--bad)} .warn-i{color:var(--warn)}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:980px){.grid2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{margin:0 0 12px;font-size:15px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card h2 small{font-weight:400;color:var(--ink3);font-size:12.5px}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ep{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);cursor:pointer;text-align:left;padding:0;transition:border-color .15s,transform .15s}
.ep:hover{border-color:var(--ink3);transform:translateY(-1px)}
.ep:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ep .th{aspect-ratio:4/3;background:var(--sunk);position:relative;display:grid;place-items:center;color:var(--ink3);font-size:12px}
.ep .th img{width:100%;height:100%;object-fit:cover;display:block}
.ep .no{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.62);color:#fff;border-radius:6px;padding:0 7px;font-size:12px;font-weight:600}
.res{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;white-space:nowrap}
.res.success{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.fprog{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:start}
.fprog .ft{display:flex;flex-direction:column;gap:4px;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.fprog .ft.sug{border-color:var(--bad)}.fprog .last,.fprog>b{grid-column:1/-1}
.res.failure{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.res.unlabeled{background:var(--sunk);color:var(--ink3)}
.ep .th .res{position:absolute;right:8px;top:8px;background:var(--surface)}
.ep .bd{padding:9px 11px 11px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink2)}
.ep .row{display:flex;justify-content:space-between;gap:8px}
.pbar{display:flex;height:7px;border-radius:4px;overflow:hidden;gap:2px;background:transparent}
.pbar span{display:block;height:100%;border-radius:2px}
.sbar{height:15px}.sbar span{color:#fff;font-size:10px;line-height:15px;text-align:center;overflow:hidden;white-space:nowrap}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:11.5px;color:var(--ink2);white-space:nowrap}
.chip.hold{border-color:color-mix(in srgb,var(--ph-task) 55%,var(--line));color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:8px;border-radius:2px;display:inline-block}
.checks{display:flex;flex-direction:column;gap:2px}
.gh{font-size:12px;color:var(--ink3);margin:10px 0 4px;letter-spacing:.04em}
.gh:first-child{margin-top:0}
.ck{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.ck:last-child{border-bottom:0}
.ck .ic{font-weight:700;text-align:center}
.ck .nm{font-weight:600;font-size:13.5px}
.ck .nm small{font-weight:400;color:var(--ink3);margin-left:6px}
.ck .ac{font-size:12.5px;color:var(--ink2);word-break:break-word}
.ck .why{font-size:12px;color:var(--ink3)}
.bars{display:flex;flex-direction:column;gap:6px}
.br{display:grid;grid-template-columns:44px minmax(0,1fr) 52px;gap:8px;align-items:center;font-size:12.5px;cursor:pointer;border-radius:6px;padding:2px 4px}
.br:hover{background:var(--sunk)}
.br .lab{color:var(--ink2)} .br .v{text-align:right;color:var(--ink2)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--ink3);font-weight:500;font-size:12px}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--sunk)}
details.card summary{cursor:pointer;font-weight:600;font-size:15px}
details.card[open] summary{margin-bottom:10px}
.qa p{margin:2px 0 10px;color:var(--ink2);font-size:13.5px}
.qa b{font-size:13.5px}
code,kbd{font-family:Consolas,Menlo,monospace;font-size:12px;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.empty{padding:40px 10px;text-align:center;color:var(--ink3)}
/* 详情抽屉 */
.scrim{position:fixed;inset:0;background:rgba(10,10,8,.38);z-index:20;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(860px,100%);background:var(--bg);z-index:21;transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.open .scrim{display:block} .open .drawer{transform:none}
.dh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.dh h2{margin:0;font-size:18px;display:flex;align-items:center;gap:8px}
.dh .sp{flex:1}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:32px;height:32px;cursor:pointer;padding:0 8px}
.ib:disabled{opacity:.35;cursor:default}
.db{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.meta{color:var(--ink3);font-size:12.5px}
.mk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:600px){.mk{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mk div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.mk b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.mk span{font-size:12px;color:var(--ink3)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--ink3);font-size:11px}
.chart .xh{stroke:var(--ink3);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:0 4px 18px rgba(0,0,0,.12);display:none;white-space:nowrap;z-index:2}
.tip .r{display:flex;align-items:center;gap:6px} .tip i{width:10px;height:3px;border-radius:2px;display:inline-block}
.tip b{font-variant-numeric:tabular-nums}
.lgt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.lgt button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:1px 8px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;color:var(--ink2)}
.lgt button i{width:12px;height:3px;border-radius:2px;display:inline-block}
.lgt button[aria-pressed="false"]{opacity:.4}
.segs{display:flex;flex-direction:column}
.sg{display:grid;grid-template-columns:96px 74px minmax(0,1fr);gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.sg .t{color:var(--ink3);font-variant-numeric:tabular-nums} .sg .p{font-size:12px;color:var(--ink3)}
.imgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.imgs figure{margin:0} .imgs img{width:100%;border-radius:8px;display:block;background:var(--sunk)}
.imgs figcaption{font-size:11.5px;color:var(--ink3);margin-top:2px}
.islots{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.islot{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:5px;background:var(--surface);cursor:pointer;min-width:0}
.islot.on{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 25%,transparent)}
.islot .ih{display:flex;align-items:center;gap:6px;min-width:0}
.islot .ino{font-weight:700;font-size:12px;background:var(--sunk);border-radius:5px;padding:0 6px}
.islot .inm{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.islot input{flex:1;min-width:0;font:inherit;font-size:13px;padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.islot .icur{font-size:11px;color:var(--acc);font-weight:700}
.ibar{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}.ibar span{display:block;height:100%;background:var(--acc)}
.cbox{position:relative;margin-top:4px}.cbox pre{margin:0;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:12.5px/1.5 Consolas,Menlo,monospace;overflow-x:auto;white-space:pre}
.cbtn{position:absolute;right:6px;top:6px;padding:1px 8px;font-size:12px}
.gbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.gbar select,.gsel select{font:inherit;font-size:13px;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.gchk{font-size:13px;display:inline-flex;gap:5px;align-items:center;color:var(--ink2)}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg2 button{border:0;background:var(--surface);padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.gsel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;background:var(--sunk);border-radius:8px;padding:6px 10px;margin-bottom:10px}.gsel[hidden]{display:none}
.eps2{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.ep2{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);cursor:pointer;min-width:0;transition:border-color .12s}
.ep2:hover{border-color:var(--ink3)}.ep2.sel{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 30%,transparent)}.ep2.isbad{border-color:color-mix(in srgb,var(--bad) 60%,var(--line))}
.th2{aspect-ratio:4/3;background:var(--sunk);position:relative}.th2 img{width:100%;height:100%;object-fit:cover;display:block}
.th2 .no{position:absolute;left:5px;top:5px;background:rgba(0,0,0,.62);color:#fff;border-radius:5px;padding:0 5px;font-size:11px;font-weight:600}
.th2 .r{position:absolute;right:5px;top:5px;border-radius:50%;width:18px;height:18px;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface)}
.th2 .r.success{color:var(--good)}.th2 .r.failure{color:var(--bad)}
.th2 .gck{position:absolute;left:5px;bottom:5px;width:16px;height:16px;margin:0;cursor:pointer}
.b2{padding:6px 8px 8px;display:flex;flex-direction:column;gap:4px;font-size:12px;min-width:0}.b2 b{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar.thin{height:8px}.sbar.thin span{font-size:0}
.chip.bad{border-color:var(--bad);color:var(--bad);overflow:hidden;text-overflow:ellipsis;max-width:100%}
.glist img.mini{width:56px;height:42px;object-fit:cover;border-radius:4px;display:block}.glist tr.isbad td{background:color-mix(in srgb,var(--bad) 6%,transparent)}
.pager{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:10px}.pager .btn:disabled{opacity:.4;cursor:default}
.islot.over{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--surface))}
body.dragging .islot{border-style:dashed}
.ibad{color:var(--bad);font-weight:600}
.ctl{max-width:1240px;margin:14px auto 0;padding:0 16px}
.ctl .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.ctl .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.ctl h2{margin:0;font-size:15px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ctl .mode{border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;color:#fff;background:var(--ink3)}
.ctl .mode.rec{background:var(--good)}.ctl .mode.prep,.ctl .mode.reset{background:#b7791f}.ctl .mode.busy{background:var(--acc)}
.kb{min-width:44px;font-weight:700}.kb.big{padding:8px 16px}.kb.ok{border-color:var(--good);color:var(--good)}.kb.no{border-color:var(--bad);color:var(--bad)}
.kb.stepon{background:var(--ink);color:var(--bg)}
.kb:disabled{opacity:.35;cursor:default}
.ctl .prog{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:13.5px}
.ctl .prog .big{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.ctl .pbar2{width:140px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}.ctl .pbar2 span{display:block;height:100%;background:var(--good)}
.ctl .last.ok{color:var(--good);font-weight:600}.ctl .last.bad{color:var(--bad);font-weight:600}
.ctl .msg{font-size:13px;min-height:18px;margin-top:8px}.ctl .msg.err{color:var(--bad)}
.ctl pre.term{background:#0d1117;color:#d6e2ee;border-radius:8px;padding:10px 12px;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;max-height:260px;overflow:auto;white-space:pre-wrap;margin:8px 0 0}
.ctl details summary{cursor:pointer;font-size:13px;color:var(--ink2);margin-top:10px}
.ctl select{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.grid2.wide{grid-template-columns:1fr}
.badp{border-left:4px solid var(--bad)}.badp h2{color:var(--bad)}
.bg{padding:8px 0;border-top:1px dashed var(--line)}.bg:first-of-type{border-top:0}
.bh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.bh .cnt{font-size:12px;border-radius:999px;padding:0 8px;background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);font-weight:700}
.bl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.bep{display:inline-flex;gap:5px;align-items:baseline;border:1px solid var(--line);border-radius:7px;padding:2px 8px;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;background:var(--surface)}
.bep:hover{border-color:var(--bad)}.bep small{font-weight:400;color:var(--ink2);font-size:11.5px}
.pend{border-left:4px solid var(--line)}.pend.has{border-left-color:#b7791f;background:color-mix(in srgb,#b7791f 6%,var(--surface))}
.pend .ph{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.pend .ph b{margin-right:8px}
.pend pre.term,.ctl pre.term{background:#0d1117;color:#d6e2ee;border-radius:8px;padding:10px 12px;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;max-height:260px;overflow:auto;white-space:pre-wrap;margin:8px 0 0}
.pend .msg{font-size:13px}.pend .msg.err{color:var(--bad)}
.ckall summary{cursor:pointer;font-size:13px;color:var(--ink2);padding:8px 0}
.note{font-size:12.5px;color:var(--ink2);background:var(--sunk);border-radius:8px;padding:8px 10px}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20h16M7 20v-5l4-4 3 3 4-6"/><circle cx="18" cy="8" r="1.6"/></svg>NERO 采集数据</div>
  <nav class="dss" id="dss" aria-label="数据集"></nav>
  <div class="live" id="live"><i></i><span>连接中…</span></div>
  <button class="theme" id="theme" title="切换明暗" aria-label="切换明暗">◐</button>
</div></header>
<section id="ctl" class="ctl" hidden></section>
<main id="main"><div class="empty">正在读取数据…</div></main>
<div id="dw"><div class="scrim" id="scrim"></div><aside class="drawer" id="drawer" aria-label="单条详情"></aside></div>
<script>
const PH = {"复位":"--ph-reset","定位移动":"--ph-pos","任务遥操作":"--ph-task","未记录":"--ph-none"};
const RES = {success:["✓","成功"],failure:["✗","失败"],unlabeled:["?","未标注"]};
const JN = ["j1 底座转","j2 大臂","j3 大臂转","j4 小臂","j5 小臂转","j6 腕摆","j7 腕转"];
const SER = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7"];
const STC = {1:"--s1",2:"--s4",3:"--s7",4:"--s5"};
const sbar = st => st && st.length ? `<div class="pbar sbar" title="${esc(st.map(x => `${x.step} ${x.name} ${x.t0}–${x.t1}s`).join("，"))}">` + st.map(x => `<span style="flex:${Math.max(x.t1 - x.t0, 0.01)};background:var(${STC[x.step] || "--ph-none"})">${x.t1 - x.t0 > 0 ? esc(x.name) : ""}</span>`).join("") + `</div>` : "";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cv = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let GAL = { item: "all", bad: false, view: "tile", page: 0, sel: new Set(), sort: "new" }; try { GAL.view = localStorage.getItem("nero-view") || "tile"; } catch (e) {}
let TASKS = {}, DS = [], cur = null, S = null, lastGen = {}, openEp = null, EPC = {}, EDIT_ITEMS = false;
const SINGLE = window.NERO_SINGLE || null;   // 打包给别人看时：report/index.html 只看这一个数据集，只读
const RB = n => SINGLE ? "" : `${encodeURIComponent(n)}/report/`;

try { const t = localStorage.getItem("nero-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
$("#theme").onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("nero-theme", document.documentElement.dataset.theme); } catch (e) {}
  render(); if (openEp != null) showEp(openEp, true);
};

const getJSON = async u => { const r = await fetch(u + (u.includes("?") ? "&" : "?") + "t=" + Date.now()); if (!r.ok) throw new Error(r.status); return r.json(); };
const res = r => `<span class="res ${r}">${RES[r][0]} ${RES[r][1]}</span>`;
const pbar = (ph, L) => `<div class="pbar" title="${esc(ph.map(p => `${p.name} ${p.t0}–${p.t1}s`).join("，"))}">` +
  ph.map(p => `<span style="flex:${Math.max(p.t1 - p.t0, 0.01)};background:var(${PH[p.name] || "--ph-none"})"></span>`).join("") + `</div>`;
const legendPh = () => `<div class="legend">${["复位","定位移动","任务遥操作"].map(k => `<span><i style="background:var(${PH[k]})"></i>${k}</span>`).join("")}</div>`;
const ago = g => { if (!g) return ""; const s = (Date.now() - new Date(g.replace(" ", "T"))) / 1000; return s < 90 ? "刚刚" : s < 3600 ? `${Math.round(s/60)} 分钟前` : s < 86400 ? `${Math.round(s/3600)} 小时前` : g.slice(0, 16); };

async function poll(first) {
  try {
    const d = SINGLE ? await getJSON("summary.json").then(x => ({ datasets: [{ name: SINGLE, generated: x.generated, episodes: x.episodes }] })) : await getJSON("datasets.json"); DS = d.datasets || []; TASKS = d.tasks || TASKS;
    const want = decodeURIComponent(location.hash.slice(1)).split("/")[0];
    if (!cur || !DS.find(x => x.name === cur)) cur = DS.find(x => x.name === want)?.name || DS[0]?.name;
    const it = DS.find(x => x.name === cur);
    const key = `${it?.generated}|${it?.labels_mtime}`;
    if (it && (first || lastGen[cur] !== key || !S || S.name !== cur)) {
      if (it.empty) {
        const lab = await getJSON(`_labels/${encodeURIComponent(cur)}.json`).catch(() => ({ items: {}, current: 0, per_item: 10 }));
        const tk = Object.values(d.tasks || {}).find(t => t.dataset === cur) || {};
        S = { name: cur, dataset: "/data/panhe/lerobot_data/" + cur, task: tk.task || "", fps: "—", generated: "", step_names: Object.keys(tk.steps || {}).length ? tk.steps : undefined,
              items: [], checks: [], episodes: 0, success: 0, failure: 0, unlabeled: 0, total_minutes: 0, check_ok: 0, check_total: 0, empty: true,
              labels: { ...lab, progress: {}, has_item_field: true, item_label: tk.item_label || "物品" },
              fail: tk.failure ? { per_type: tk.failure.per_type || 20, types: tk.failure.types || {}, definitions: tk.failure.definitions || {}, count: {}, good: {} } : undefined };
      } else S = await getJSON(`${RB(cur)}summary.json`);
      lastGen[cur] = key; EPC = {}; if (!EDIT_ITEMS) render();
      if (openEp != null) showEp(openEp, true);
    }
    navDs(); const l = $("#live"); l.className = "live"; l.querySelector("span").textContent = `实时 · ${S && S.generated ? S.generated.slice(5, 16) + " 更新" : "等第一条"}${it?.live ? " · 正在录制" : ""}`;
  } catch (e) { const l = $("#live"); l.className = "live off"; l.querySelector("span").textContent = "连不上服务（检查 8766 转发）"; }
}
function navDs() {
  $("#dss").innerHTML = DS.map(x => `<button class="ds" aria-current="${x.name === cur}" data-n="${esc(x.name)}">${x.live ? "● " : ""}${esc(x.name)}<small>${x.episodes ?? 0}</small></button>`).join("");
  document.querySelectorAll(".ds").forEach(b => b.onclick = () => { cur = b.dataset.n; openEp = null; closeEp(); location.hash = cur; S = null; poll(true); });
}

function render() {
  if (!S) { $("#main").innerHTML = `<div class="empty">还没有任何数据集的报告。录完第一条（按 → 或 Esc 保存）后会自动出现。</div>`; return; }
  const it = S.items || [], n = it.length, lab = S.success + S.failure;
  const A = S.checks.filter(c => c.group === "A"), B = S.checks.filter(c => c.group === "B");
  const mx = Math.max(1, ...it.map(e => e.length_s));
  const ck = c => { const ic = c.status === "ok" ? ["✓","ok-i","满足"] : c.status === "warn" ? ["!","warn-i","注意"] : ["✗","bad-i","不满足"];
    return `<div class="ck"><div class="ic ${ic[1]}" title="${ic[2]}">${ic[0]}</div><div><div class="nm">${esc(c.item)}<small>${esc(c.require)}</small></div><div class="ac">${esc(c.actual)}</div>${c.why ? `<div class="why">${esc(c.why)}</div>` : ""}</div></div>`; };
  const okA = A.filter(c => c.status === "ok").length;
  $("#main").innerHTML = `
  <section class="hero"><div><h1>${esc(S.name)}</h1><div class="task">任务：${esc(S.task || "—")}</div><div class="path">${esc(S.dataset)} · ${S.fps} Hz · 最后保存 ${esc(S.generated)}</div></div>
    ${S.empty ? "" : `<div class="dl"><a class="btn" href="${RB(S.name)}episodes.csv" download>⇣ 明细 CSV</a><a class="btn" href="${RB(S.name)}summary.json" target="_blank">{ } summary.json</a>${SINGLE ? "" : `<a class="btn" href="${encodeURIComponent(S.name)}/" target="_blank">▤ 原始文件</a>`}</div>`}</section>
  <section class="kpis">
    <div class="kpi"><b>${n}</b><span>条数据 · ${S.total_minutes} 分钟</span></div>
    <div class="kpi"><div class="split"><b class="ok-i">${S.success}</b><em>✓ 成功</em><b class="bad-i">${S.failure}</b><em>✗ 失败</em></div><span>${S.unlabeled ? `未标注 ${S.unlabeled} 条` : "全部已标注"}</span></div>
    ${S.fail ? `<div class="kpi"><b>${Object.values(S.fail.good).reduce((a, x) => a + Math.min(x, S.fail.per_type), 0)}<small style="font-size:14px;font-weight:400"> / ${Object.keys(S.fail.types).length * S.fail.per_type}</small></b><span>失败类型合格条数</span></div>` : `<div class="kpi"><b>${lab ? Math.round(S.success / lab * 100) : 0}%</b><span>成功率（已标注）</span></div>`}
    <div class="kpi"><b>${n ? (it.reduce((a, e) => a + e.length_s, 0) / n).toFixed(1) : 0}<small style="font-size:14px;font-weight:400"> s</small></b><span>平均每条</span></div>
    <div class="kpi"><b class="${okA === A.length ? "ok-i" : "bad-i"}">${okA}/${A.length}</b><span>学长数据标准满足项</span></div>
  </section>
  ${pendingPanel()}
  ${failPanel()}
  ${itemsPanel()}
  ${badPanel()}
  <section class="grid2">
    <div class="card" id="gal">${galleryCard()}</div>
    <div style="display:flex;flex-direction:column;gap:18px;min-width:0">${checksCard(A, B, ck)}</div>
  </section>
  <details class="card qa"><summary>说明与常见问题</summary>
    <b>大阶段</b><p>录制时每帧记下定位模式开/关：第一次开定位前 = 复位；定位开着 = 定位移动；最后一次关定位后 = 任务遥操作。离线补的数据没有阶段信息（灰色）。</p>
    <b>夹住怎么判断</b><p>从臂夹爪自己不报“夹紧”。报告比较主臂指令宽度和从臂实际宽度：指令比实际更合拢 8 mm 以上、持续 1 s 以上，就是被物体挡住了，即夹住。</p>
    <b>step</b><p>录制时按数字键：${Object.entries(S.step_names || {1: "抓", 2: "移动", 3: "放置", 4: "离开"}).map(([k, v]) => k + " " + v).join("、")}。每条开始自动是 1；按错了直接按对的数字。每帧存在 step_index 里。</p>
    <b>动作分段</b><p>关节速度 &gt; 3°/s 为移动；夹爪 1.5 s 内变化 &gt; 10 mm 为闭合或张开。</p>
    <b>页面不刷新</b><p>窗口 5 要运行 <code>~/nero_report_serve.sh</code>，Windows 要开着 <code>ssh -N -L 8766:127.0.0.1:8766 panhe@192.168.1.102</code>。每条在复位结束（按 → 或 Esc）时才保存。</p>
    <b>重算统计</b><p><code>source ~/env_evo.sh; python ~/nero_report.py /data/panhe/lerobot_data/数据集名</code>，录制时的截图和大阶段会保留。</p>
  </details>`;
  document.querySelectorAll("#main .br[data-ep], #tblsec [data-ep]").forEach(el => el.onclick = () => showEp(+el.dataset.ep));
  wireItems(); wireGallery(); relabel($("#main"));
  if (S.empty) { $("#main .grid2").style.display = "none"; }
  wireExport();
}

function codeBox(t) { return `<div class="cbox"><button class="btn cbtn" type="button" data-copy="${esc(t)}">复制</button><pre>${esc(t)}</pre></div>`; }
/* ---------- 数据标准：只展开没通过的 ---------- */
function checksCard(A, B, ck) {
  const all = [...A, ...B], bad = all.filter(c => c.status !== "ok"), okA = A.filter(c => c.status === "ok").length, okB = B.filter(c => c.status === "ok").length;
  return `<div class="card"><h2>数据标准检查 <small>A 学长标准 ${okA}/${A.length} · B 训练兼容 ${okB}/${B.length}</small></h2><div class="checks">
    ${bad.length ? bad.map(ck).join("") : `<div class="ck"><div class="ic ok-i">✓</div><div><div class="nm">全部 ${all.length} 项都满足</div></div></div>`}
    <details class="ckall"><summary>${bad.length ? `另外 ${all.length - bad.length} 项已满足，点开看全部` : "点开看每一项"}</summary>
      <div class="gh">A · 学长数据标准</div>${A.map(ck).join("")}<div class="gh">B · Evo-RL 训练兼容</div>${B.map(ck).join("")}</details></div></div>`;
}

/* ---------- 还没写入数据集的修改 + 一键处理并导出 ---------- */
let EXP = {};
function pendingPanel() {
  if (SINGLE || S.empty) return "";
  const nStep = (S.pending_edits || []).length, nItem = (S.items || []).filter(e => e.item_pending).length, j = EXP[cur];
  const pend = nStep + nItem;
  return `<section class="card pend ${pend ? "has" : ""}"><div class="ph"><div>
      ${pend ? `<b>有 ${pend} 条修改还没写入数据集</b><span class="meta">（${[nStep ? `step ${nStep} 条` : "", nItem ? `${IL()} ${nItem} 条` : ""].filter(Boolean).join("、")}；网页上的修改先存在报告里，导出前要写进数据集）</span>`
             : `<b>没有待写入的修改</b><span class="meta">数据集和网页上看到的一致</span>`}</div>
    <button class="btn kb big ${j?.status === "running" ? "" : "ok"}" id="expbtn" ${j?.status === "running" ? "disabled" : ""}>${j?.status === "running" ? `处理中：${esc(j.stage)}…` : "⇪ 处理并导出"}</button></div>
    <div class="meta" style="margin-top:6px">按顺序做：写入修改 → 逐条核对（nero_verify）→ 打包成 ~/${esc(cur)}.tgz；核对没全部通过就停下、不打包。录制程序在跑时不能用。</div>
    ${j ? `<div class="msg ${j.status === "failed" ? "err" : ""}" style="margin-top:8px">${j.status === "done" ? "✓ " : j.status === "failed" ? "✗ " : ""}${esc(j.message || "")}</div>
      ${j.status === "done" ? codeBox(`scp panhe@192.168.1.102:~/${cur}.tgz %USERPROFILE%\\Downloads\\`) : ""}
      <details ${j.status !== "done" ? "open" : ""}><summary class="meta">日志（${j.log.length} 行 · ${esc(j.started)}${j.ended ? "–" + esc(j.ended) : ""}）</summary><pre class="term">${esc(j.log.slice(-80).join("\n"))}</pre></details>` : ""}
  </section>`;
}
async function expPoll(name) {
  try { const r = await getJSON(`api/export_state?dataset=${encodeURIComponent(name)}`); if (r.job) EXP[name] = r.job; } catch (e) {}
  if (name === cur && !EDIT_ITEMS) { const el = $("#main .pend"); if (el) { el.outerHTML = pendingPanel(); wireExport(); } }
  if (EXP[name]?.status === "running") setTimeout(() => expPoll(name), 1000);
  else if (EXP[name]?.status === "done") poll(true);
}
function wireExport() {
  const b = $("#expbtn"); if (!b) return;
  b.onclick = async () => {
    if (!confirm(`处理并导出 ${cur}？\n会把网页上的修改写进数据集（原文件自动备份），再逐条核对、打包。`)) return;
    const r = await fetch("api/export", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ dataset: cur }) }).then(x => x.json()).catch(e => ({ ok: false, error: e.message }));
    if (!r.ok) { alert(r.error); return; }
    expPoll(cur);
  };
  if (!EXP[cur]) getJSON(`api/export_state?dataset=${encodeURIComponent(cur)}`).then(r => { if (r.job) { EXP[cur] = r.job; if (r.job.status === "running") expPoll(cur); else { const el = $("#main .pend"); if (el) { el.outerHTML = pendingPanel(); wireExport(); } } } }).catch(() => {});
}

/* ---------- 每条数据：缩略图 / 列表、筛选、分页、多选、拖到物品 ---------- */
const PAGE = 30;
function galList() {
  let L = (S.items || []).slice().reverse();
  if (GAL.item !== "all") L = L.filter(e => String(e.item || 0) === GAL.item);
  if (GAL.bad) L = L.filter(e => (e.issues || []).length);
  const by = { new: (a, b) => b.episode - a.episode, old: (a, b) => a.episode - b.episode, long: (a, b) => b.length_s - a.length_s, short: (a, b) => a.length_s - b.length_s,
               bad: (a, b) => (b.issues || []).length - (a.issues || []).length || b.episode - a.episode, item: (a, b) => (a.item || 99) - (b.item || 99) || a.episode - b.episode }[GAL.sort];
  return by ? L.slice().sort(by) : L;
}
function issueChip(e) { const n = (e.issues || []).length; return n ? `<span class="chip bad" title="${esc(e.issues.join("；"))}">⚠ ${n === 1 ? esc(e.issues[0]) : n + " 个问题"}</span>` : ""; }
function galleryCard() {
  const all = S.items || []; if (!all.length) return `<h2>每条数据</h2><div class="empty">还没有数据。每条在复位结束（按 → 或 Esc）时保存，保存后 5 秒内出现在这里。</div>`;
  const L = galList(), pages = Math.max(1, Math.ceil(L.length / PAGE)); GAL.page = Math.min(GAL.page, pages - 1);
  const view = L.slice(GAL.page * PAGE, GAL.page * PAGE + PAGE), hasItem = S.labels?.has_item_field, items = S.labels?.items || {};
  const nbad = all.filter(e => (e.issues || []).length).length;
  const tb = `<div class="gbar">
    ${hasItem ? `<select id="gitem"><option value="all">全部物品（${all.length}）</option>${Object.entries(items).map(([k, v]) => `<option value="${k}" ${GAL.item === k ? "selected" : ""}>${k} · ${esc(v || "物品 " + k)}（${all.filter(e => String(e.item) === k).length}）</option>`).join("")}<option value="0" ${GAL.item === "0" ? "selected" : ""}>未标（${all.filter(e => !e.item).length}）</option></select>` : ""}
    <label class="gchk"><input type="checkbox" id="gbad" ${GAL.bad ? "checked" : ""}> 只看有问题（${nbad}）</label>
    <select id="gsort" title="排序">${[["new", "新的在前"], ["old", "旧的在前"], ["long", "时长长的在前"], ["short", "时长短的在前"], ["bad", "有问题的在前"], ["item", "按物品"]].map(([k, v]) => `<option value="${k}" ${GAL.sort === k ? "selected" : ""}>${v}</option>`).join("")}</select>
    <span style="flex:1"></span>
    <div class="seg2"><button data-v="tile" aria-pressed="${GAL.view === "tile"}">缩略图</button><button data-v="list" aria-pressed="${GAL.view === "list"}">列表</button></div></div>
    ${hasItem && !SINGLE ? `<div class="gsel" ${GAL.sel.size ? "" : "hidden"}>已选 <b>${GAL.sel.size}</b> 条 → 移到 <select id="gmove">${Object.entries(items).map(([k, v]) => `<option value="${k}">${k} · ${esc(v || "物品 " + k)}</option>`).join("")}</select> <button class="btn" id="gmovebtn">移动</button> <button class="btn" id="gclear">取消选择</button></div>` : ""}`;
  const ck = e => hasItem && !SINGLE ? `<input type="checkbox" class="gck" data-sel="${e.episode}" ${GAL.sel.has(e.episode) ? "checked" : ""} title="选中（可多选后一起移到别的物品）">` : "";
  const tile = e => `<div class="ep2${GAL.sel.has(e.episode) ? " sel" : ""}${(e.issues || []).length ? " isbad" : ""}" data-ep="${e.episode}" draggable="${hasItem && !SINGLE}" title="第 ${e.episode} 条${hasItem ? " · " + esc(e.item_name || "") : ""}${(e.issues || []).length ? " · " + esc(e.issues.join("；")) : ""}">
      <div class="th2">${e.thumb ? `<img loading="lazy" src="${RB(S.name)}${e.thumb}" alt="">` : ""}<span class="no">#${e.episode}</span><span class="r ${e.result}">${RES[e.result][0]}${e.fail_type ? " F" + e.fail_type : ""}</span>${ck(e)}</div>
      <div class="b2">${hasItem ? `<b>${esc(e.item_name || "未标")}${e.item_pending ? " *" : ""}</b>` : ""}<span class="meta">${e.length_s} s · ${esc(e.recorded.slice(11, 16))}</span>${sbar(e.steps).replace('class="pbar sbar"', 'class="pbar sbar thin"')}${issueChip(e)}</div></div>`;
  const row = e => `<tr class="${(e.issues || []).length ? "isbad" : ""}" data-ep="${e.episode}" draggable="${hasItem && !SINGLE}"><td>${ck(e)}</td><td>${e.episode}</td><td>${e.thumb ? `<img class="mini" loading="lazy" src="${RB(S.name)}${e.thumb}" alt="">` : ""}</td>
      ${hasItem ? `<td><b>${esc(e.item_name || "未标")}</b>${e.item_pending ? " *" : ""}</td>` : ""}<td>${res(e.result)}</td><td class="num">${e.length_s}</td><td class="num">${e.frames}</td><td style="min-width:150px">${sbar(e.steps) || "—"}</td><td style="min-width:90px">${pbar(e.phases || [], e.length_s)}</td><td>${issueChip(e) || '<span class="meta">—</span>'}</td><td class="meta">${esc(e.motion_summary || "")}</td><td class="num">${e.gripper_range_mm ?? ""}</td><td class="num">${e.action_state_diff_deg ?? ""}</td><td class="meta">${esc(e.recorded.slice(5, 16))}</td></tr>`;
  const body = !view.length ? `<div class="empty">没有符合条件的条目</div>` : GAL.view === "list"

function lineChart(el, t, series, o) {
  const W = el.clientWidth || 760, H = o.h || 220, L = 40, R = 12, T = 10, B = 24;
  const on = series.filter(s => s.on !== false); const all = on.flatMap(s => s.y);
  let lo = Math.min(...all), hi = Math.max(...all); if (!isFinite(lo)) { lo = 0; hi = 1; } if (hi - lo < 1e-6) { hi = lo + 1; }
  const pad = (hi - lo) * 0.06; lo -= pad; hi += pad; const tx = t[t.length - 1] || 1;
  const X = v => L + (W - L - R) * v / tx, Y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">`;
  (o.bands || []).forEach(b => s += `<rect x="${X(b.t0)}" y="${T}" width="${Math.max(2, X(b.t1) - X(b.t0))}" height="${H - T - B}" fill="var(--hold)"/>`);
  for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4; s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v.toFixed(0)}</text>`; }
  for (let i = 0; i <= 5; i++) { const v = tx * i / 5; s += `<text class="ax" x="${X(v)}" y="${H - 6}" text-anchor="middle">${v.toFixed(0)}s</text>`; }
  s += `<text class="ax" x="${L}" y="${T - 1}">${esc(o.unit)}</text>`;
  on.forEach(se => s += `<polyline points="${se.y.map((y, i) => `${X(t[i]).toFixed(1)},${Y(y).toFixed(1)}`).join(" ")}" fill="none" stroke="var(${se.c})" stroke-width="2" stroke-linejoin="round" ${se.dash ? 'stroke-dasharray="5 4"' : ""}/>`);
  s += `<line class="xh" id="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" style="display:none"/><rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" class="hit"/></svg><div class="tip"></div>`;
  el.innerHTML = s;
  const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), xh = el.querySelector("#xh");
  const move = ev => { const r = svg.getBoundingClientRect(); const px = (ev.clientX - r.left) * W / r.width; const tv = (px - L) / (W - L - R) * tx;
    let i = 0, bd = 1e9; t.forEach((v, k) => { const d = Math.abs(v - tv); if (d < bd) { bd = d; i = k; } });
    xh.setAttribute("x1", X(t[i])); xh.setAttribute("x2", X(t[i])); xh.style.display = "";
    tip.innerHTML = `<div class="meta">${t[i].toFixed(1)} s</div>` + on.map(se => `<div class="r"><i style="background:var(${se.c})"></i>${esc(se.name)} <b>${se.y[i].toFixed(1)}</b>${esc(o.u || "")}</div>`).join("") + (o.extra ? o.extra(t[i]) : "");
    tip.style.display = "block"; const lx = X(t[i]) * r.width / W; tip.style.left = Math.min(Math.max(0, lx + 12), r.width - tip.offsetWidth) + "px"; tip.style.top = "8px"; };
  svg.querySelector(".hit").addEventListener("pointermove", move);
  svg.querySelector(".hit").addEventListener("pointerleave", () => { tip.style.display = "none"; xh.style.display = "none"; });
}
function timeline(el, e) {
  const W = el.clientWidth || 760, L = 70, R = 12, rowH = 22, lanes = [["step", "step"], ["阶段", "phase"], ["移动", "move"], ["夹爪", "grip"], ["夹住", "hold"]];
  const H = lanes.length * (rowH + 6) + 22, tx = e.length_s || 1, X = v => L + (W - L - R) * v / tx;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="时间线">`; const items = [];
  lanes.forEach(([nm], k) => s += `<text class="ax" x="0" y="${k * (rowH + 6) + 15}">${nm}</text><line class="gl" x1="${L}" x2="${W - R}" y1="${k * (rowH + 6) + rowH + 2}" y2="${k * (rowH + 6) + rowH + 2}"/>`);
  const box = (k, t0, t1, c, txt) => { const y = k * (rowH + 6) + 2; items.push(txt); s += `<rect x="${X(t0)}" y="${y}" width="${Math.max(3, X(t1) - X(t0) - 2)}" height="${rowH - 2}" rx="4" fill="var(${c})" data-i="${items.length - 1}" class="tb"/>`; };
  (e.steps || []).forEach(x => { box(0, x.t0, x.t1, STC[x.step] || "--ph-none", `step ${x.step} ${x.name} ${x.t0}–${x.t1} s`); if (X(x.t1) - X(x.t0) > 30) s += `<text x="${X(x.t0) + 6}" y="${15}" fill="#fff" font-size="11" pointer-events="none">${x.step} ${esc(x.name)}</text>`; });
  if (!(e.steps || []).length) s += `<text class="ax" x="${L + 4}" y="15">没有 step 记录</text>`;
  e.phases.forEach(p => box(1, p.t0, p.t1, PH[p.name] || "--ph-none", `${p.name} ${p.t0}–${p.t1} s`));
  e.segments.forEach(g => { if (g.kind === "move") box(2, g.t0, g.t1, "--ink3", `${g.t0}–${g.t1} s ${g.text}`);
    if (g.kind === "close" || g.kind === "open") box(3, g.t0, g.t1, g.kind === "close" ? "--s7" : "--s4", `${g.t0}–${g.t1} s ${g.text}`);
    if (g.kind === "hold") box(4, g.t0, g.t1, "--ph-task", `${g.t0}–${g.t1} s ${g.text}`); });
  for (let i = 0; i <= 5; i++) { const v = tx * i / 5; s += `<text class="ax" x="${X(v)}" y="${H - 4}" text-anchor="middle">${v.toFixed(0)}s</text>`; }
  el.innerHTML = s + `</svg><div class="tip"></div>`;
  const tip = el.querySelector(".tip"), svg = el.querySelector("svg");
  el.querySelectorAll(".tb").forEach(r => { r.style.cursor = "default";
    r.addEventListener("pointerenter", ev => { tip.textContent = items[+r.dataset.i]; tip.style.display = "block"; const rr = svg.getBoundingClientRect(), b = r.getBoundingClientRect();
      tip.style.left = Math.min(b.left - rr.left, rr.width - tip.offsetWidth) + "px"; tip.style.top = (b.bottom - rr.top + 4) + "px"; });
    r.addEventListener("pointerleave", () => tip.style.display = "none"); });
  el.insertAdjacentHTML("beforeend", `<div class="legend" style="margin-top:4px">${["复位","定位移动","任务遥操作"].map(k => `<span><i style="background:var(${PH[k]})"></i>${k}</span>`).join("")}<span><i style="background:var(--s7)"></i>闭合</span><span><i style="background:var(--s4)"></i>张开</span><span><i style="background:var(--ph-task)"></i>夹住</span></div>`);
}

  const fpg = pg && pg.fail ? `<div class="prog fprog">${pg.fail.types.map(t => `<div class="ft${pg.fail.suggest === t.k ? " sug" : ""}"><b>F${esc(t.k)} ${esc(t.name)}</b>
      <span class="big">${t.good}<small style="font-size:13px;font-weight:400"> / ${pg.fail.per}</small></span><div class="pbar2"><span style="width:${Math.min(100, t.good / pg.fail.per * 100)}%"></span></div>
      <span class="meta">${t.total > t.good ? `另有 ${t.total - t.good} 条有问题` : pg.fail.suggest === t.k ? "建议下一条做这种" : t.good >= pg.fail.per ? "已采满" : ""}</span></div>`).join("")}
      ${pg.last ? `<span class="last ${pg.last.issues.length ? "bad" : "ok"}">刚保存：第 ${pg.last.episode} 条${pg.last.fail_type ? " · F" + pg.last.fail_type : ""} ${pg.last.issues.length ? "⚠ " + esc(pg.last.issues.join("；")) : "✓ 正常"}</span>` : ""}
      ${pg.fail.suggest ? "" : `<b class="ok-i">四种失败都采满了</b>`}</div>` : "";
  const prog = pg && pg.fail ? fpg : pg ? `<div class="prog"><span>${esc(il)} <b>${esc(pg.cur)} · ${esc(pg.name || "未命名")}</b></span>
      <span class="big">${pg.good}<small style="font-size:13px;font-weight:400"> / ${pg.per}</small></span><div class="pbar2"><span style="width:${Math.min(100, pg.good / pg.per * 100)}%"></span></div>
      <span class="meta">合格（成功且没问题）${pg.total > pg.good ? ` · 另有 ${pg.total - pg.good} 条有问题` : ""}</span>
      ${pg.last ? `<span class="last ${pg.last.issues.length ? "bad" : "ok"}">刚保存：第 ${pg.last.episode} 条 ${pg.last.issues.length ? "⚠ " + esc(pg.last.issues.join("；")) : "✓ 正常"}</span>` : ""}
      ${pg.good >= pg.per ? (pg.next ? `<button class="btn kb ok" id="cnext" data-k2="${esc(pg.next.k)}">已采满 → 切到 ${esc(pg.next.k)} · ${esc(pg.next.name)}</button>` : `<b class="ok-i">全部${esc(il)}都采满了</b>`) : ""}</div>` : "";
  box.innerHTML = `<div class="box">${head}${prog}${rows}<div class="msg ${CTL.err ? "err" : ""}">${esc(CTL.msg)}</div>
    <details ${CTL.open ? "open" : ""} id="cterm"><summary>终端 ${esc(st.target)}（最近 28 行）</summary><pre class="term">${esc(st.pane || "")}</pre></details></div>`;
  box.querySelectorAll("[data-k]").forEach(x => x.onclick = () => ctlDo(x.dataset.k, {}, x.dataset.k === "esc" ? "结束录制？（复位阶段会先保存已标记的那条）" : null));
  if ($("#cstart")) $("#cstart").onclick = () => ctlDo("start", { preset: $("#cpre").value }, `开始采集「${TASKS[$("#cpre").value]?.name}」？先确认从臂已使能、相机在跑、手放急停。`);
  if ($("#cyes")) $("#cyes").onclick = () => ctlDo("yes", {}, "在终端输入 yes？（开录前检查要主臂转到从臂姿态时才需要；主臂会动）");
  if ($("#cpon")) $("#cpon").onclick = () => ctlDo("pos_on");
  if ($("#cnext")) $("#cnext").onclick = async () => {
    const k = +$("#cnext").dataset.k2, ds = lv.dataset;
    const r = await fetch("api/labels", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ dataset: ds, current: k }) }).then(x => x.json()).catch(e => ({ ok: false, error: e.message }));
    CTL.msg = r.ok ? `已切到 ${k} 号，下一条开始生效` : "切换失败：" + r.error; CTL.err = !r.ok; ctlRender(); if (r.ok && ds === cur) poll(true);
  };
  if ($("#cpoff")) $("#cpoff").onclick = () => ctlDo("pos_off", {}, "关定位？确认网页已显示 Target reached 并等了 2 秒。关掉后主臂重新控制从臂。");
  const t = $("#cterm"); if (t) { t.ontoggle = () => { CTL.open = t.open; try { localStorage.setItem("nero-ctl-term", t.open ? "1" : "0"); } catch (e) {} }; const pre = t.querySelector("pre"); pre.scrollTop = pre.scrollHeight; }
}
if (!SINGLE) ctlPoll();

(async () => { await poll(true); const h = decodeURIComponent(location.hash.slice(1)).split("/"); if (h[1] && S) showEp(+h[1]); setInterval(poll, 5000); })();
</script>
</body>
</html>
